[package]
name = "srt-mio"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "UDP I/O for srt-core on mio: caller, listener with socket-id demux, recvmmsg/sendmmsg batching"
repository = "https://github.com/wavey-ai/av-rs"

[dependencies]
srt-core = { path = "../srt-core" }
libc = "0.2"
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }
socket2 = "0.5"
